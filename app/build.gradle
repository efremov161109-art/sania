plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.bluedriver.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.bluedriver.launcher'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }
}

dependencies {
    // Офлайн-распознавание речи Vosk. Для работы также нужна русская модель
    // (инструкция и место для неё — в README.md).
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
